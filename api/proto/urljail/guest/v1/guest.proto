syntax = "proto3";

package urljail.guest.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// GuestAgentService runs inside the microVM and is reached over vsock (ADR 0007).
// The host treats everything it returns as guest-attested evidence, never as truth.
service GuestAgentService {
  // Hello is the readiness check: the host calls it until the agent answers.
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Detonate opens one URL in a fresh Chrome and streams what happens. One at a time.
  // The stream ends with a Done message.
  rpc Detonate(DetonateRequest) returns (stream DetonateResponse);
  // Probe makes network attempts from inside the guest for the isolation self-test
  // (docs/network.md#isolation-test-plan-must-pass-before-live-mode-is-enabled).
  // The host judges the outcome; the guest only reports what happened.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  // Prepare launches and sets up Chrome ahead of time, so a snapshot taken afterwards holds a
  // ready browser (P4). The next Detonate uses it.
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
}

message PrepareRequest {}

message PrepareResponse {
  google.protobuf.Duration took = 1;
}

message HelloRequest {}

message HelloResponse {
  string agent_version = 1;
  // Installed browser package version, e.g. "155.0.8059.39-1".
  string browser_version = 2;
  // Guest kernel release (uname -r).
  string kernel = 3;
  // Time since guest boot.
  google.protobuf.Duration uptime = 4;
  // The guest's wall clock, to check it after a snapshot restore.
  google.protobuf.Timestamp time = 5;
  // 16 bytes from getrandom(2), to check that restored clones don't share kernel RNG state.
  bytes random = 6;
  // A browser prepared by Prepare is waiting.
  bool prepared = 7;
}

message DetonateRequest {
  string url = 1;
  // Observe for at least min_dwell (plus a random jitter of up to jitter), then stop once the
  // network is idle, or at max_dwell at the latest (open question Q11's resolution).
  google.protobuf.Duration min_dwell = 2;
  google.protobuf.Duration max_dwell = 3;
  google.protobuf.Duration jitter = 4;
}

message DetonateResponse {
  oneof msg {
    Progress progress = 1;
    Event event = 2;
    Artifact artifact = 3;
    Done done = 4;
  }
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_NAVIGATING = 1;
  STAGE_OBSERVING = 2;
  STAGE_COLLECTING = 3;
}

message Progress {
  Stage stage = 1;
  string message = 2;
}

// Event is one raw CDP event, as Chrome sent it.
message Event {
  google.protobuf.Timestamp time = 1;
  string session_id = 2;
  string method = 3;
  // The event's params object, JSON.
  bytes params = 4;
}

// Artifact is one chunk of a file; chunks of one artifact arrive in order, the last with last=true.
message Artifact {
  // File name under the run's guest/ directory, e.g. "screenshot.png".
  string name = 1;
  bytes data = 2;
  bool last = 3;
}

message Done {
  string final_url = 1;
  string title = 2;
  // Set when Page.navigate itself failed (DNS error, refused connection, ...).
  string navigation_error = 3;
  google.protobuf.Duration dwell = 4;
  // Why observation stopped: "network idle", "max dwell" or "cancelled".
  string dwell_reason = 5;
  // CDP events the agent couldn't forward because its queue was full.
  int64 dropped_events = 6;
  // Set when the detonation failed inside the guest.
  string error = 7;
}

message ProbeRequest {
  repeated ProbeSpec probes = 1;
  // Per probe; probes run concurrently.
  google.protobuf.Duration timeout = 2;
}

message ProbeSpec {
  // Echoed back in the result.
  string id = 1;
  oneof kind {
    // Open a TCP connection to host:port.
    string tcp = 2;
    // Send one UDP datagram to host:port and wait briefly for any reply.
    string udp = 3;
    // Resolve a name with the guest's configured resolver.
    string dns = 4;
    // Resolve a name by asking this server ("ip:53") directly.
    DNSVia dns_via = 5;
  }
}

message DNSVia {
  string name = 1;
  string server = 2;
}

message ProbeResult {
  string id = 1;
  // "connected", "timeout", "refused", "reply", "no reply", "resolved", "no answer" or "error".
  string outcome = 2;
  // Addresses for DNS probes; error text otherwise.
  repeated string detail = 3;
}

message ProbeResponse {
  repeated ProbeResult results = 1;
}
